name: Build DSH IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          brew install meson ninja lld
          which node npm || brew install node
          node --version; npm --version
      - name: Build emulator
        run: make emulator
      - name: Build rootfs
        run: make rootfs
      - name: Generate Xcode project
        run: make project
      - name: Build app (unsigned)
        run: |
          xcodebuild -project DSH.xcodeproj -scheme DSH -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" DSH_DEVELOPMENT_TEAM="" build
      - name: Package IPA
        run: |
          APP=$(ls -dt ~/Library/Developer/Xcode/DerivedData/DSH-*/Build/Products/Release-iphoneos/DSH.app | head -1)
          echo "APP=$APP"
          ls -la "$APP"
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -qr DSH.ipa Payload
          ls -lh DSH.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DSH-ipa
          path: DSH.ipa
          if-no-files-found: error
